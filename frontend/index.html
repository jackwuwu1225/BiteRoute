<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BiteRoute · 星圖美食路跑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Space Grotesk', 'Noto Sans TC', system-ui, sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: #05050f;
      position: relative;
      overflow: hidden;
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(0,229,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.035) 1px, transparent 1px);
      background-size: 44px 44px;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.09);
    }

    .glass-strong {
      background: rgba(5,5,20,0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .theme-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .theme-btn:hover {
      background: rgba(0,229,255,0.08);
      border-color: rgba(0,229,255,0.3);
    }
    .theme-btn.active {
      background: rgba(0,229,255,0.12);
      border-color: #00e5ff;
      box-shadow: 0 0 18px rgba(0,229,255,0.25), inset 0 0 12px rgba(0,229,255,0.06);
    }
    .theme-btn.active .theme-label { color: #00e5ff; }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    #budgetSlider::-webkit-slider-thumb {
      background: #00e5ff;
      box-shadow: 0 0 14px rgba(0,229,255,0.9);
    }
    #budgetSlider::-moz-range-thumb {
      background: #00e5ff;
      box-shadow: 0 0 14px rgba(0,229,255,0.9);
    }
    #radiusSlider::-webkit-slider-thumb {
      background: #ff006e;
      box-shadow: 0 0 14px rgba(255,0,110,0.9);
    }
    #radiusSlider::-moz-range-thumb {
      background: #ff006e;
      box-shadow: 0 0 14px rgba(255,0,110,0.9);
    }

    .btn-generate {
      background: linear-gradient(135deg, #00e5ff 0%, #006eff 100%);
      box-shadow: 0 0 28px rgba(0,229,255,0.45), 0 4px 24px rgba(0,110,255,0.3);
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
    }
    .btn-generate:hover {
      box-shadow: 0 0 44px rgba(0,229,255,0.65), 0 4px 36px rgba(0,110,255,0.45);
      transform: translateY(-1px);
    }
    .btn-generate:active { transform: translateY(1px); box-shadow: 0 0 16px rgba(0,229,255,0.3); }

    @keyframes pulseRing {
      0%   { transform: scale(0.4); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .ring { animation: pulseRing 2.4s ease-out infinite; }
    .ring:nth-child(2) { animation-delay: 0.8s; }
    .ring:nth-child(3) { animation-delay: 1.6s; }

    @keyframes toastIn  { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-6px); } }
    .toast-enter { animation: toastIn  0.35s cubic-bezier(0.22,1,0.36,1) forwards; }
    .toast-exit  { animation: toastOut 0.3s ease-in forwards; }

    @keyframes starPulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50%       { opacity: 0.8; transform: scale(1.4); }
    }

    .action-bar {
      background: rgba(5,5,20,0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(0,229,255,0.18);
    }

    .btn-ig {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 0 22px rgba(220,39,67,0.4);
      transition: all 0.25s ease;
      cursor: pointer;
      border: none;
    }
    .btn-ig:hover { box-shadow: 0 0 36px rgba(220,39,67,0.6); transform: translateY(-1px); }

    .btn-reset {
      transition: all 0.25s ease;
      cursor: pointer;
      border: none;
    }
    .btn-reset:hover { background: rgba(255,255,255,0.1); }

    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>
</head>

<body>
<div id="app" class="grid-bg">

  <div class="absolute top-1/4 -left-24 w-72 h-72 rounded-full pointer-events-none"
       style="background:radial-gradient(circle,rgba(0,229,255,0.12),transparent 70%);filter:blur(40px);"></div>
  <div class="absolute bottom-1/3 -right-24 w-72 h-72 rounded-full pointer-events-none"
       style="background:radial-gradient(circle,rgba(255,0,110,0.10),transparent 70%);filter:blur(40px);"></div>

  <div id="toastContainer"
       class="absolute top-4 right-3 z-50 flex flex-col gap-2 pointer-events-none"
       style="max-width:280px;"></div>

  <!-- ═══════════════ STATE 1 · INPUT ═══════════════ -->
  <div id="inputPanel" class="absolute inset-0 flex flex-col overflow-y-auto">

    <div class="flex-shrink-0 px-6 pt-14 pb-2 text-center">
      <div class="flex items-center justify-center gap-2 mb-2">
        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"
              style="animation:starPulse 2s ease-in-out infinite;"></span>
        <span class="text-cyan-400/50 text-xs tracking-widest uppercase" style="letter-spacing:.2em;">Gourmet Constellation</span>
        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"
              style="animation:starPulse 2s ease-in-out infinite .5s;"></span>
      </div>
      <h1 class="text-4xl font-bold tracking-tight text-white">
        Bite<span style="color:#00e5ff;text-shadow:0 0 22px rgba(0,229,255,0.75);">Route</span>
      </h1>
      <p class="text-white/25 text-xs mt-1.5 tracking-widest">以餐廳連成你的美食星座</p>
    </div>

    <div class="flex-1 px-4 pb-8">
      <div class="glass rounded-3xl p-5 space-y-5">

        <div>
          <p class="text-white/40 text-xs tracking-widest uppercase mb-3 flex items-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles text-cyan-400" style="font-size:10px;"></i>
            選擇路線主題
          </p>
          <div class="grid grid-cols-3 gap-2">
            <button class="theme-btn active rounded-2xl py-3.5 px-1 flex flex-col items-center gap-1.5"
                    data-theme="dessert_run" onclick="selectTheme(this)">
              <span class="text-2xl leading-none">🍰</span>
              <span class="theme-label text-white/80 text-xs font-medium leading-tight transition-colors">甜點路跑</span>
            </button>
            <button class="theme-btn rounded-2xl py-3.5 px-1 flex flex-col items-center gap-1.5"
                    data-theme="local_foodie" onclick="selectTheme(this)">
              <span class="text-2xl leading-none">🍜</span>
              <span class="theme-label text-white/80 text-xs font-medium leading-tight transition-colors">在地老饕</span>
            </button>
            <button class="theme-btn rounded-2xl py-3.5 px-1 flex flex-col items-center gap-1.5"
                    data-theme="drunken_voyage" onclick="selectTheme(this)">
              <span class="text-2xl leading-none">🍸</span>
              <span class="theme-label text-white/80 text-xs font-medium leading-tight transition-colors">微醺奇航</span>
            </button>
          </div>
        </div>

        <div class="border-t border-white/5"></div>

        <div>
          <div class="flex justify-between items-baseline mb-3">
            <label class="text-white/40 text-xs tracking-widest uppercase flex items-center gap-2">
              <i class="fa-solid fa-coins" style="font-size:10px;color:#facc15;"></i>
              探索預算
            </label>
            <span id="budgetDisplay" class="text-2xl font-bold"
                  style="color:#00e5ff;text-shadow:0 0 12px rgba(0,229,255,0.6);">$ 800</span>
          </div>
          <input type="range" id="budgetSlider" min="100" max="5000" value="800" step="50"
                 oninput="onBudgetInput(this)" />
          <div class="flex justify-between text-white/20 text-xs mt-1.5">
            <span>$ 100</span><span>$ 5,000</span>
          </div>
        </div>

        <div class="border-t border-white/5"></div>

        <div>
          <div class="flex justify-between items-baseline mb-3">
            <label class="text-white/40 text-xs tracking-widest uppercase flex items-center gap-2">
              <i class="fa-solid fa-location-dot" style="font-size:10px;color:#ff006e;"></i>
              探索半徑
            </label>
            <span id="radiusDisplay" class="text-2xl font-bold"
                  style="color:#ff006e;text-shadow:0 0 12px rgba(255,0,110,0.6);">1500 m</span>
          </div>
          <input type="range" id="radiusSlider" min="500" max="3000" value="1500" step="100"
                 oninput="onRadiusInput(this)" />
          <div class="flex justify-between text-white/20 text-xs mt-1.5">
            <span>500 m</span><span>3,000 m</span>
          </div>
          <div id="bikeWarning" style="display:none;"
               class="mt-2.5 flex items-start gap-1.5 text-yellow-400/65 text-xs">
            <span>🚲</span>
            <span>距離較遠，建議搭配 YouBike 或機車</span>
          </div>
        </div>

        <div class="border-t border-white/5"></div>

        <button class="btn-generate w-full py-4 rounded-2xl text-white font-bold text-base tracking-wide
                       flex items-center justify-center gap-2.5"
                onclick="generateRoute()">
          <span>✨</span>
          <span>生成星圖</span>
          <i class="fa-solid fa-chevron-right text-xs opacity-60"></i>
        </button>

        <p class="text-white/18 text-center text-xs tracking-wide" style="color:rgba(255,255,255,0.18);">
          需開啟瀏覽器定位權限
        </p>
      </div>
    </div>
  </div>

  <!-- ═══════════════ STATE 2 · LOADING ═══════════════ -->
  <div id="loadingPanel" class="hidden absolute inset-0 flex flex-col items-center justify-center gap-6">
    <div class="relative flex items-center justify-center" style="width:140px;height:140px;">
      <div class="ring absolute inset-0 rounded-full border border-cyan-400/30"></div>
      <div class="ring absolute inset-0 rounded-full border border-cyan-400/25"></div>
      <div class="ring absolute inset-0 rounded-full border border-cyan-400/20"></div>
      <div class="glass relative w-16 h-16 rounded-full flex items-center justify-center z-10"
           style="box-shadow:0 0 32px rgba(0,229,255,0.3);">
        <i id="loadingIcon" class="fa-solid fa-location-crosshairs text-cyan-400 text-2xl"></i>
      </div>
    </div>
    <div class="text-center space-y-2">
      <p id="loadingText" class="text-white/70 text-sm tracking-wide">📍 正在獲取定位...</p>
      <p class="text-white/25 text-xs">演算法正在計算最美星圖</p>
    </div>
  </div>

  <!-- ═══════════════ STATE 3 · RESULT ═══════════════ -->
  <div id="resultPanel" class="hidden absolute inset-0 flex flex-col">

    <div id="mapContainer" class="relative flex-1 overflow-hidden bg-gray-950">
    </div>

    <div class="absolute top-4 left-4 right-4 flex justify-between items-start pointer-events-none z-10">
      <div class="glass rounded-2xl px-3.5 py-2.5">
        <p class="text-white/35 text-xs mb-0.5">解鎖星座</p>
        <p id="constellationBadge" class="text-white font-semibold text-sm"></p>
      </div>
      <div class="glass rounded-2xl px-3.5 py-2.5 text-right">
        <p class="text-white/35 text-xs mb-0.5">總消費</p>
        <p id="priceBadge" class="font-bold text-sm" style="color:#00e5ff;text-shadow:0 0 10px rgba(0,229,255,0.7);"></p>
      </div>
    </div>

    <div class="action-bar flex-shrink-0 px-4 py-4 flex gap-3">
      <button onclick="shareToIG()"
              class="btn-ig flex-1 flex items-center justify-center gap-2 py-3.5 rounded-2xl
                     font-semibold text-sm text-white">
        <i class="fa-brands fa-instagram text-base"></i>
        <span>分享至 IG</span>
      </button>
      <button onclick="resetApp()"
              class="btn-reset glass flex-1 flex items-center justify-center gap-2 py-3.5 rounded-2xl
                     font-semibold text-sm text-white">
        <i class="fa-solid fa-rotate" style="color:#00e5ff;"></i>
        <span>重新探索</span>
      </button>
    </div>
  </div>

</div>

<script>
const API_URL = 'http://127.0.0.1:8000/api/v1/generate_route';

const CONSTELLATION_ZH = {
  summer_triangle: '夏季大三角',
  southern_cross:  '南十字星',
  cassiopeia:      '仙后座',
  big_dipper:      '北斗七星',
  libra:           '天秤座',
  orion_belt:      '獵戶腰帶',
  gemini:          '雙子座',
  aries:           '牡羊座',
  taurus:          '金牛座',
  cancer:          '巨蟹座',
  leo:             '獅子座',
  square:          '四方陣',
  hexagon:         '六角星陣',
};

let selectedTheme = 'dessert_run';
let routeData     = null;

function sliderBg(slider, color) {
  const pct = ((+slider.value - +slider.min) / (+slider.max - +slider.min)) * 100;
  slider.style.background =
    `linear-gradient(to right,${color} ${pct}%,rgba(255,255,255,0.13) ${pct}%)`;
}

function onBudgetInput(el) {
  document.getElementById('budgetDisplay').textContent =
    `$ ${(+el.value).toLocaleString()}`;
  sliderBg(el, '#00e5ff');
}

function onRadiusInput(el) {
  const val = +el.value;
  document.getElementById('radiusDisplay').textContent = `${val} m`;
  sliderBg(el, '#ff006e');
  document.getElementById('bikeWarning').style.display = val > 1500 ? 'flex' : 'none';
}

function selectTheme(btn) {
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedTheme = btn.dataset.theme;
}

function showState(s) {
  ['inputPanel','loadingPanel','resultPanel'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.toggle('hidden', !id.startsWith(s.split('Panel')[0]));
  });
  const ids = { input: 'inputPanel', loading: 'loadingPanel', result: 'resultPanel' };
  Object.entries(ids).forEach(([k,id]) => {
    document.getElementById(id).classList.toggle('hidden', k !== s);
  });
}

function setLoadingText(text) {
  document.getElementById('loadingText').textContent = text;
}

function setLoadingIcon(iconClass) {
  document.getElementById('loadingIcon').className = `fa-solid ${iconClass} text-cyan-400 text-2xl`;
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');

  const palette = {
    error:   'rgba(40,10,10,0.92)',
    success: 'rgba(5,30,15,0.92)',
    info:    'rgba(5,20,35,0.92)',
  };
  const border = {
    error:   'rgba(255,80,80,0.45)',
    success: 'rgba(0,229,120,0.45)',
    info:    'rgba(0,229,255,0.45)',
  };

  el.style.cssText = `
    background:${palette[type]||palette.info};
    border:1px solid ${border[type]||border.info};
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-radius:14px;
    padding:10px 14px;
    font-size:13px;
    color:rgba(255,255,255,0.88);
    line-height:1.4;
    pointer-events:auto;
    box-shadow:0 4px 24px rgba(0,0,0,0.5);
  `;
  el.className = 'toast-enter';
  el.textContent = msg;
  container.appendChild(el);

  setTimeout(() => {
    el.classList.remove('toast-enter');
    el.classList.add('toast-exit');
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }, 3400);
}

function validateBudget(budget) {
  if (budget < 150) {
    showToast("這點錢只能畫一個『點』喔！去巷口買御飯糰吧 🍙", 'error');
    return false;
  }
  if (budget < 300) {
    showToast("演算法表示：臣妾做不到啊！加點預算解鎖星圖吧 ✨", 'error');
    return false;
  }
  if (budget > 3000) {
    showToast("乾爹您好！已為您啟動財富自由導航模式 💰", 'success');
  }
  return true;
}

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('瀏覽器不支援定位功能'));
      return;
    }
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      timeout: 12000, maximumAge: 60000, enableHighAccuracy: true,
    });
  });
}

function geoErrorMsg(err) {
  const msgs = {
    1: '定位權限被拒絕，請在瀏覽器設定中允許位置存取',
    2: '無法取得位置，請確認 GPS 已開啟',
    3: '定位請求超時，請稍後再試',
  };
  return msgs[err.code] || ('定位失敗：' + err.message);
}

function injectMap(mapHtml) {
  const container = document.getElementById('mapContainer');
  container.innerHTML = '';
  const blob = new Blob([mapHtml], { type: 'text/html' });
  const url  = URL.createObjectURL(blob);
  const frame = document.createElement('iframe');
  frame.src = url;
  frame.style.cssText = 'width:100%;height:100%;border:none;display:block;';
  frame.onload = () => URL.revokeObjectURL(url);
  container.appendChild(frame);
}

async function generateRoute() {
  const budget = +document.getElementById('budgetSlider').value;
  const radius = +document.getElementById('radiusSlider').value;

  if (!validateBudget(budget)) return;

  showState('loading');
  setLoadingText('📍 正在獲取定位...');
  setLoadingIcon('fa-location-crosshairs');

  let position;
  try {
    position = await getPosition();
  } catch (err) {
    showToast(geoErrorMsg(err), 'error');
    showState('input');
    return;
  }

  setLoadingText('🌌 演算法尋找星圖中...');
  setLoadingIcon('fa-star');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ui_theme:             selectedTheme,
        search_radius_meters: radius,
        total_budget:         budget,
        user_lat:             position.coords.latitude,
        user_lng:             position.coords.longitude,
      }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    routeData = data;

    if (data.status !== 'success') {
      const errMap = {
        insufficient_restaurants: '附近主題餐廳不足，試試擴大探索半徑？',
        no_valid_route:           '預算內找不到合適組合，試試調高預算？',
      };
      showToast(errMap[data.status] || '路線生成失敗，請稍後再試', 'error');
      showState('input');
      return;
    }

    const zhName = CONSTELLATION_ZH[data.constellation_matched] || data.constellation_matched;
    document.getElementById('constellationBadge').textContent = zhName;
    document.getElementById('priceBadge').textContent = `$ ${(+data.total_price).toLocaleString()}`;

    injectMap(data.map_html);
    showState('result');

  } catch (err) {
    showToast('連線失敗：請確認後端伺服器已啟動 (port 8000)', 'error');
    showState('input');
  }
}

function resetApp() {
  routeData = null;
  document.getElementById('mapContainer').innerHTML = '';
  showState('input');
}

function buildStatsOverlay(cname, price) {
  const el = document.createElement('div');
  el.id = 'statsOverlay';
  el.style.cssText = `
    position:absolute;inset:0;z-index:9999;
    display:flex;flex-direction:column;justify-content:flex-end;
    background:linear-gradient(to bottom,rgba(5,5,15,0.15) 0%,rgba(5,5,15,0.9) 60%,rgba(5,5,15,0.97) 100%);
    padding:0 28px 36px;font-family:'Space Grotesk',sans-serif;
  `;
  el.innerHTML = `
    <div style="text-align:center;">
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;">
        <div style="flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(0,229,255,0.55));"></div>
        <span style="color:rgba(0,229,255,0.65);font-size:11px;letter-spacing:.2em;text-transform:uppercase;">BiteRoute</span>
        <div style="flex:1;height:1px;background:linear-gradient(to left,transparent,rgba(0,229,255,0.55));"></div>
      </div>
      <div style="color:rgba(255,255,255,0.4);font-size:12px;letter-spacing:.15em;margin-bottom:6px;">解鎖星座</div>
      <div style="color:#fff;font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:22px;">${cname}</div>
      <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(0,229,255,0.1);
                  border:1px solid rgba(0,229,255,0.25);border-radius:12px;padding:10px 24px;margin-bottom:24px;">
        <span style="color:rgba(255,255,255,0.45);font-size:12px;letter-spacing:.1em;">TOTAL</span>
        <span style="color:#00e5ff;font-size:26px;font-weight:700;text-shadow:0 0 18px rgba(0,229,255,0.8);">
          $ ${(+price).toLocaleString()}
        </span>
      </div>
      <div style="color:rgba(255,255,255,0.18);font-size:10px;letter-spacing:.18em;">biteroute.app</div>
    </div>
  `;
  return el;
}

function cropTo45(src) {
  const ratio = 4 / 5;
  const srcR  = src.width / src.height;
  let sx = 0, sy = 0, sw = src.width, sh = src.height;
  if (srcR > ratio) { sw = Math.round(sh * ratio); sx = Math.round((src.width - sw) / 2); }
  else               { sh = Math.round(sw / ratio); sy = Math.round((src.height - sh) / 2); }
  const out = document.createElement('canvas');
  out.width  = sw;
  out.height = sh;
  out.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
  return out;
}

function applyFilmGrain(canvas, intensity) {
  const ctx  = canvas.getContext('2d');
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const px   = data.data;
  for (let i = 0; i < px.length; i += 4) {
    const g = (Math.random() - 0.5) * intensity;
    px[i]     = Math.min(255, Math.max(0, px[i]     + g));
    px[i + 1] = Math.min(255, Math.max(0, px[i + 1] + g));
    px[i + 2] = Math.min(255, Math.max(0, px[i + 2] + g));
  }
  ctx.putImageData(data, 0, 0);
}

async function shareToIG() {
  if (!routeData) return;

  const cname = CONSTELLATION_ZH[routeData.constellation_matched] || routeData.constellation_matched;
  const mapContainer = document.getElementById('mapContainer');

  const overlay = buildStatsOverlay(cname, routeData.total_price);
  mapContainer.style.position = 'relative';
  mapContainer.appendChild(overlay);

  await new Promise(r => setTimeout(r, 320));

  try {
    const canvas = await html2canvas(mapContainer, {
      allowTaint:             true,
      useCORS:                true,
      scale:                  2,
      backgroundColor:        '#05050f',
      logging:                false,
      foreignObjectRendering: false,
      ignoreElements:         el => el.tagName === 'IFRAME',
    });

    const cropped = cropTo45(canvas);
    applyFilmGrain(cropped, 38);

    const link = document.createElement('a');
    link.download = `biteroute_${routeData.constellation_matched || 'route'}.png`;
    link.href     = cropped.toDataURL('image/png', 0.95);
    link.click();

    showToast('截圖已儲存！快去 IG 曬出你的星圖 🌟', 'success');
  } catch (e) {
    showToast('截圖失敗，請手動截圖分享 📸', 'error');
  } finally {
    overlay.remove();
  }
}
